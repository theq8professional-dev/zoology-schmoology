<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Stick Insect ID - Stick Walkers</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #080800;
            color: #ffe600;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.4);
        }
        #game-container {
            text-align: center;
            max-width: 450px;
            width: 90%;
            background: #141400;
            padding: 20px;
            border: 2px solid #ffe600;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.3), inset 0 0 15px rgba(255, 183, 0, 0.2);
        }
        h2 {
            color: #ffe600;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.8);
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        #title-display {
            font-size: 13px;
            color: #ffb700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(255, 183, 0, 0.6);
        }
        #taunt-box {
            color: #ffe600;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 0;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.8);
            letter-spacing: 1px;
            min-height: 18px;
        }
        #taunt-box:not(:empty) {
            margin-bottom: 10px;
        }
        #image-box {
            width: 100%;
            height: 260px;
            background: #000;
            border: 2px solid #ffe600;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(255, 230, 0, 0.4);
            position: relative;
        }
        #image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1);
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: #262600;
            color: #ffe600;
            border: 2px solid #ffe600;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 0 #998a00, 0 8px 15px rgba(0, 0, 0, 0.8);
            transition: all 0.05s ease;
            text-transform: capitalize;
        }
        .option-btn:hover {
            background: #3d3d00;
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 6px 0 #ffe600, 0 0 18px #ffe600;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #998a00, 0 0 20px #ffe600, 0 0 35px #ffe600;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffb700;
            text-shadow: 0 0 8px rgba(255, 183, 0, 0.6);
        }
    </style>
</head>
<body>

<div id="game-container">
    <h2>[ STICK WALKERS ]</h2>
    <div id="title-display">RANK: TWIG BLIND</div>
    <div id="taunt-box"></div>
    <div id="image-box">SCANNING CANOPY...</div>
    <div id="options-container"></div>
    <div id="hud">
        <div id="rare-counter">RARE PHASMIDS: 0/10</div>
        <div id="streak">STREAK: 0</div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const ultraRareStickInsects = [
        "Giant Prickly Stick Insect",
        "Javan Leaf Insect",
        "Lord Howe Island Stick Insect",
        "Goliath Stick Insect",
        "Spiny Leaf Insect",
        "Pink-Winged Phasma",
        "Philippine Leaf Insect",
        "Thorny Tree-Nymph",
        "Jungle Nymph",
        "Black Beauty Stick Insect"
    ];

    // Fallback local collection in case of internet loss or API block
    const fallbackStickInsects = [
        { name: "Giant Prickly Stick Insect", photo: "https://images.unsplash.com/photo-1534567153574-2b12153a87f0?w=500" },
        { name: "Phryganistria chinensis", photo: "https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=500" },
        { name: "Spiny Leaf Insect", photo: "https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=500" },
        { name: "Jungle Nymph", photo: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500" }
    ];

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 3.0;

        osc.connect(gainNode);
        gainNode.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.18);
            gainNode.gain.setValueAtTime(1.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.linearRampToValueAtTime(70, now + 0.25);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, now);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'rare-found') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440.00, now);
            osc.frequency.setValueAtTime(554.37, now + 0.1);
            osc.frequency.setValueAtTime(659.25, now + 0.2);
            osc.frequency.setValueAtTime(880.00, now + 0.3);
            gainNode.gain.setValueAtTime(1.4, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        }
    }

    const taunts = [
        "FOOLED BY A LEAF!",
        "IT WAS JUST A TWIG...",
        "CAMOUFLAGE WIN!",
        "LOOK CLOSER NEXT TIME.",
        "TRICKED BY NATURE!",
        "WORST ENTOMOLOGIST IN TOWN."
    ];

    const praises = [
        "HAWK EYES!",
        "CAMOUFLAGE BUSTED!",
        "SHARP EYE!",
        "IMPOSSIBLE FIND!",
        "SPOT ON!"
    ];

    function getRankTitle(streak) {
        if (streak >= 50) return "RANK: MASTER CAMOUFLAGE OVERLORD";
        if (streak >= 20) return "RANK: PHASMID EXPERT";
        if (streak >= 15) return "RANK: CANOPY TRACKER";
        if (streak >= 10) return "RANK: LEAF WHISPERER";
        if (streak >= 6) return "RANK: TWIG SPOTTER";
        if (streak >= 3) return "RANK: BRANCH SCOUT";
        return "RANK: TWIG BLIND";
    }

    let streak = 0;
    let currentCorrectAnswer = "";
    let isCurrentRoundRare = false;
    let globalRareCount = 0;

    async function fetchStickInsects() {
        try {
            const randomPage = Math.floor(Math.random() * 20) + 1;
            // CORRECT TAXON ID FOR PHASMIDA (Stick Insects) IS 47198
            const response = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=47198&verifiable=true&photos=true&quality_grade=research&page=${randomPage}&per_page=30`);
            
            if (!response.ok) throw new Error("API Network issue");

            const data = await response.json();

            return data.results
                .filter(obs => obs.taxon && obs.photos && obs.photos.length > 0)
                .map(obs => {
                    const name = obs.taxon.preferred_common_name || obs.taxon.name;
                    return {
                        name: name,
                        photo: obs.photos[0].url.replace('square', 'medium')
                    };
                });
        } catch (error) {
            console.warn("API Fetch bypassed/failed, using local set:", error);
            return fallbackStickInsects;
        }
    }

    async function nextRound() {
        const container = document.getElementById('options-container');
        const imageBox = document.getElementById('image-box');
        
        container.innerHTML = `<div style="color:#ffe600; padding:20px;">LOCATING SPECIMEN...</div>`;

        let validObs = [];
        let attempts = 0;

        // Fetch max 2 times to prevent browser freeze
        while (validObs.length < 4 && attempts < 2) {
            attempts++;
            const batch = await fetchStickInsects();
            batch.forEach(obs => {
                if (!validObs.some(o => o.name.toLowerCase() === obs.name.toLowerCase())) {
                    validObs.push(obs);
                }
            });
        }

        // If API fails to produce 4 items, backfill with fallback array
        if (validObs.length < 4) {
            fallbackStickInsects.forEach(obs => {
                if (!validObs.some(o => o.name.toLowerCase() === obs.name.toLowerCase())) {
                    validObs.push(obs);
                }
            });
        }

        const correctChoice = validObs[Math.floor(Math.random() * validObs.length)];
        currentCorrectAnswer = correctChoice.name;
        
        isCurrentRoundRare = ultraRareStickInsects.some(bug => bug.toLowerCase() === currentCorrectAnswer.toLowerCase()) && (globalRareCount < 10);

        let wrongChoices = validObs.filter(o => o.name.toLowerCase() !== currentCorrectAnswer.toLowerCase());
        wrongChoices.sort(() => Math.random() - 0.5);
        
        let choices = [correctChoice, ...wrongChoices.slice(0, 3)];
        choices.sort(() => Math.random() - 0.5);

        imageBox.innerHTML = `<img src="${correctChoice.photo}" alt="Stick Insect Observation">`;

        container.innerHTML = '';

        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = choice.name;
            
            btn.onclick = () => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                playSound('click');
                const tauntBox = document.getElementById('taunt-box');
                
                if (choice.name.toLowerCase() === currentCorrectAnswer.toLowerCase()) {
                    streak++;
                    
                    if (isCurrentRoundRare) {
                        playSound('rare-found');
                        globalRareCount++;
                        document.getElementById('rare-counter').innerText = `RARE PHASMIDS: ${globalRareCount}/10`;
                        tauntBox.innerText = `⚡ RARE CAMOUFLAGE MASTER SPOTTED! (${globalRareCount}/10)`;
                        tauntBox.style.color = "#ffe600";
                    } else {
                        playSound('correct');
                        const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                        tauntBox.innerText = randomPraise;
                        tauntBox.style.color = "#ffe600";
                    }
                } else {
                    streak = 0;
                    playSound('wrong');
                    const randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];
                    tauntBox.innerText = randomTaunt;
                    tauntBox.style.color = "#ffb700";
                }
                
                document.getElementById('streak').innerText = `STREAK: ${streak}`;
                document.getElementById('title-display').innerText = getRankTitle(streak);
                nextRound();
            };
            container.appendChild(btn);
        });
    }

    nextRound();
</script>

</body>
</html>
