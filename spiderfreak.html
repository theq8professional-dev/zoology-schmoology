<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Spider ID - Spider_Freak!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #05020a;
            color: #39ff14;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
        }
        #game-container {
            text-align: center;
            max-width: 450px;
            width: 90%;
            background: #11051a;
            padding: 20px;
            border: 2px solid #e000ff;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(224, 0, 255, 0.4), inset 0 0 15px rgba(57, 255, 20, 0.2);
        }
        h2 {
            color: #e000ff;
            text-shadow: 0 0 10px rgba(224, 0, 255, 0.8);
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        #title-display {
            font-size: 13px;
            color: #ffe600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(255, 230, 0, 0.6);
        }
        #taunt-box {
            color: #e000ff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 0;
            text-shadow: 0 0 8px rgba(224, 0, 255, 0.8);
            letter-spacing: 1px;
            min-height: 18px;
        }
        #taunt-box:not(:empty) {
            margin-bottom: 10px;
        }
        #image-box {
            width: 100%;
            height: 260px;
            background: #000;
            border: 2px solid #39ff14;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.5);
            position: relative;
        }
        #image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1);
        }

        /* Tactile 3D Arcade Buttons */
        .option-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: #230038;
            color: #39ff14;
            border: 2px solid #39ff14;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 0 #1b8508, 0 8px 15px rgba(0, 0, 0, 0.8);
            transition: all 0.05s ease;
        }
        .option-btn:hover {
            background: #3b005e;
            color: #ffffff;
            border-color: #ffe600;
            box-shadow: 0 6px 0 #39ff14, 0 0 18px #39ff14;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1b8508, 0 0 20px #39ff14, 0 0 35px #39ff14;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ffe600;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
        }
    </style>
</head>
<body>

<div id="game-container">
    <h2>[ SPIDER_FREAK!]</h2>
    <div id="title-display">RANK: ARACHNOPHOBE</div>
    <div id="taunt-box"></div>
    <div id="image-box">INITIALIZING FEED...</div>
    <div id="options-container"></div>
    <div id="hud">
        <div id="rare-counter">RARE SPIDERS: 0/10</div>
        <div id="streak">STREAK: 0</div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const ultraRareSpiders = [
        "Peacock Spider",
        "Gooty Sapphire Tarantula",
        "Goliath Birdeater",
        "Sydney Funnel-web Spider",
        "Spiny-backed Orb-weaver",
        "Mirror Spider",
        "Pelican Spider",
        "Brazilian Wandering Spider",
        "Heavy-Jawed Jumping Spider",
        "Six-eyed Sand Spider"
    ];

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const masterGain = audioCtx.createGain();
        
        masterGain.gain.value = 3.0;

        osc.connect(gainNode);
        gainNode.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
            gainNode.gain.setValueAtTime(1.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.25);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'taunt') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.setValueAtTime(160, now + 0.15);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'rare-found') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3);
            gainNode.gain.setValueAtTime(1.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        }
    }

    let ambientInterval = null;

    function startHypnoticRhythm() {
        if (ambientInterval) return;

        ambientInterval = setInterval(() => {
            if (audioCtx.state === 'suspended') return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);

            gainNode.gain.setValueAtTime(0.30, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.start(now);
            osc.stop(now + 0.08);
        }, 500); 
    }

    function playRandomAmbientSound() {
        if (Math.random() > 0.80) return;

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const soundChoice = Math.floor(Math.random() * 3);

        if (soundChoice === 0) {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
            
            gainNode.gain.setValueAtTime(0.12, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            
            osc.start(now);
            osc.stop(now + 0.04);

        } else if (soundChoice === 1) {
            osc.type = 'triangle';
            const freqs = [1046.50, 1318.51, 1567.98];
            const randomFreq = freqs[Math.floor(Math.random() * freqs.length)];
            
            osc.frequency.setValueAtTime(randomFreq, now);
            
            gainNode.gain.setValueAtTime(0.06, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            
            osc.start(now);
            osc.stop(now + 0.3);

        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(2800, now + 0.08);
            
            gainNode.gain.setValueAtTime(0.1, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            
            osc.start(now);
            osc.stop(now + 0.08);
        }
    }

    const taunts = [
        "SORRY. WAY WRONG!",
        "PERSIST.",
        "WOW. TAKE A BREAK.",
        "WOW?? REALLY?!",
        "WOMP! WOMP!",
        "WAYYYYYYY OFF",
        "TRY AGAIN.",
        "FAIL!!",
        "WORST ARACHNOLOGIST IN THE WORLD.",
        "IMPOSSIBLY BAD!",
        "YUCK. EWWW!"
    ];

    const praises = [
        "WEBBING IT, YO!",
        "NICE SPIN!",
        "STICKYYYYYYYYYYYYYYYYYY!",
        "AMAZING SPIDER(WO)MAN!",
        "WHOA!",
        "PERFECT",
        "SPINTILLATING!!",
        "WEB OF WONDER!"
    ];

    function getRankTitle(streak) {
        if (streak >= 50) return "RANK: SUPREME ARACHNID OVERLORD";
        if (streak >= 20) return "RANK: MASTER ARACHNOLOGIST";
        if (streak >= 15) return "RANK: ELITE SILK WEAVER";
        if (streak >= 10) return "RANK: TARANTULA WHISPERER";
        if (streak >= 6) return "RANK: JUMPING SPIDER ENTHUSIAST";
        if (streak >= 3) return "RANK: WEB SKIMMER";
        return "RANK: ARACHNOPHOBE";
    }

    let streak = 0;
    let currentCorrectAnswer = "";
    let isCurrentRoundRare = false;
    let globalRareCount = 0;

    document.getElementById('rare-counter').innerText = `RARE SPIDERS: 0/10`;

    async function fetchSpiders() {
        try {
            const randomPage = Math.floor(Math.random() * 200) + 1;
            /* Taxon ID 47118 retrieves Spiders (Araneae) */
            const response = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=47118&verifiable=true&photos=true&quality_grade=research&page=${randomPage}&per_page=30`);
            const data = await response.json();
            return data.results.filter(obs => obs.taxon && obs.taxon.preferred_common_name && obs.photos && obs.photos.length > 0);
        } catch (error) {
            console.error("API fetch failed:", error);
            return [];
        }
    }

    async function nextRound() {
        const container = document.getElementById('options-container');
        const imageBox = document.getElementById('image-box');
        
        container.innerHTML = `<div style="color:#39ff14; padding:20px;">LOADING SPECIMEN...</div>`;

        let validObs = [];
        while (validObs.length < 4) {
            const batch = await fetchSpiders();
            batch.forEach(obs => {
                if (!validObs.some(o => o.taxon.preferred_common_name === obs.taxon.preferred_common_name)) {
                    validObs.push(obs);
                }
            });
        }

        const correctChoice = validObs[Math.floor(Math.random() * validObs.length)];
        currentCorrectAnswer = correctChoice.taxon.preferred_common_name;
        
        isCurrentRoundRare = ultraRareSpiders.some(spider => spider.toLowerCase() === currentCorrectAnswer.toLowerCase()) && (globalRareCount < 10);

        let wrongChoices = validObs.filter(o => o.taxon.preferred_common_name.toLowerCase() !== currentCorrectAnswer.toLowerCase());
        wrongChoices.sort(() => Math.random() - 0.5);
        
        let choices = [correctChoice, ...wrongChoices.slice(0, 3)];
        choices.sort(() => Math.random() - 0.5);

        const imageUrl = correctChoice.photos[0].url.replace('square', 'medium');
        imageBox.innerHTML = `<img src="${imageUrl}" alt="Spider Observation">`;

        playRandomAmbientSound();

        container.innerHTML = '';

        choices.forEach(choice => {
            const commonName = choice.taxon.preferred_common_name;
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = commonName;
            
            btn.onclick = () => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                startHypnoticRhythm();

                playSound('click');
                const tauntBox = document.getElementById('taunt-box');
                
                if (commonName.toLowerCase() === currentCorrectAnswer.toLowerCase()) {
                    streak++;
                    
                    if (isCurrentRoundRare) {
                        playSound('rare-found');
                        globalRareCount++;
                        document.getElementById('rare-counter').innerText = `RARE SPIDERS: ${globalRareCount}/10`;
                        tauntBox.innerText = `⚡ LEGENDARY RARE SPIDER IDENTIFIED! (${globalRareCount}/10)`;
                        tauntBox.style.color = "#39ff14";
                    } else {
                        playSound('correct');
                        const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                        tauntBox.innerText = randomPraise;
                        tauntBox.style.color = "#39ff14";
                    }
                } else {
                    streak = 0;
                    playSound('wrong');
                    playSound('taunt');
                    const randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];
                    tauntBox.innerText = randomTaunt;
                    tauntBox.style.color = "#e000ff";
                }
                
                document.getElementById('streak').innerText = `STREAK: ${streak}`;
                document.getElementById('title-display').innerText = getRankTitle(streak);
                nextRound();
            };
            container.appendChild(btn);
        });
    }

    nextRound();
</script>

</body>
</html>
