<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoology Schmoology Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0b12;
            color: #00ffcc;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            text-align: center;
            font-size: 1.6rem;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        p {
            color: #a0a0c0;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }

        .game-card {
            background: #14142b;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 15px;
            text-decoration: none;
            color: #00ffcc;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            line-height: 1.4;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .game-card:hover {
            background: #00ffcc;
            color: #0b0b12;
            box-shadow: 0 0 15px #00ffcc, 0 0 25px #00ffcc;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>ZOOLOGY SCHMOOLOGY ARCADE</h1>
    <p>Choose a game module below to test your identification skills!</p>

    <div class="game-grid">
        <a href="bats_spotting.html" class="game-card">Bats Spotting</a>
        <a href="butterfly_id.html" class="game-card">Butterfly ID</a>
        <a href="C-SLUG.html" class="game-card">C-SLUG</a>
        <a href="fox_spotting.html" class="game-card">Fox Spotting</a>
        <a href="frogmouth_beta.version.html" class="game-card">Frogmouth (Beta)</a>
        <a href="moth_id.html" class="game-card">Moth ID</a>
        <a href="raraavis2.0.html" class="game-card">Rara Avis 2.0</a>
        <a href="rays_spotting.html" class="game-card">Rays Spotting</a>
        <a href="spiderfreak.html" class="game-card">Spider Freak</a>
        <a href="starfish_spotting.html" class="game-card">Starfish Spotting</a>
        <a href="stickwalkers.html" class="game-card">Stickwalkers</a>
        <a href="turtles_id.html" class="game-card">Turtles ID</a>
    </div>

</body>
</html>
