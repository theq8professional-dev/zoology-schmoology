<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Bird ID</title>
   <style>
    body {
        margin: 0;
        padding: 0;
        background: #05050a;
        color: #00ffcc;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }
    #game-container {
        text-align: center;
        max-width: 450px;
        width: 90%;
        background: #10101a;
        padding: 20px;
        border: 2px solid #ff0077;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(255, 0, 119, 0.5), inset 0 0 15px rgba(0, 255, 204, 0.2);
    }
    h2 {
        color: #ff0077;
        text-shadow: 0 0 10px rgba(255, 0, 119, 0.8);
        margin-top: 0;
        margin-bottom: 8px;
        letter-spacing: 2px;
    }
    #title-display {
        font-size: 13px;
        color: #ffcc00;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 0 6px rgba(255, 204, 0, 0.6);
    }
    #taunt-box {
        color: #ff0077;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 0;
        text-shadow: 0 0 8px rgba(255, 0, 119, 0.8);
        letter-spacing: 1px;
        min-height: 18px;
    }
    #taunt-box:not(:empty) {
        margin-bottom: 10px;
    }
    #image-box {
        width: 100%;
        height: 260px;
        background: #000;
        border: 2px solid #00ffcc;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
        margin-bottom: 20px;
        box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.5);
        position: relative;
    }
    #image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: contrast(1.1);
    }

    /* Tactile 3D Arcade Buttons with Click Glow */
    .option-btn {
        display: block;
        width: 100%;
        padding: 14px;
        margin: 12px 0;
        background: #1a0033;
        color: #00ffcc;
        border: 2px solid #00ffcc;
        border-radius: 8px;
        font-size: 16px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        cursor: pointer;
        position: relative;
        box-shadow: 0 6px 0 #00aa88, 0 8px 15px rgba(0, 0, 0, 0.8);
        transition: all 0.05s ease;
    }
    .option-btn:hover {
        background: #2b0054;
        color: #ffffff;
        border-color: #ffffff;
        box-shadow: 0 6px 0 #00ffcc, 0 0 18px #00ffcc;
    }
    .option-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #00aa88, 0 0 20px #00ffcc, 0 0 35px #00ffcc;
    }

    #hud {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
        color: #ffcc00;
        text-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
    }
</style>
</head>
<body>

<div id="game-container">
    <h2>[ RARA AVIS ]</h2>
    <div id="title-display">RANK: BACKYARD CASUAL</div>
    <div id="taunt-box"></div>
    <div id="image-box">INITIALIZING FEED...</div>
    <div id="options-container"></div>
    <div id="hud">
        <div id="rara-counter">RARA AVIS: 0/10</div>
        <div id="streak">STREAK: 0</div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const ultraRareBirds = [
        "Cebu flowerpecker",
        "Kakapo",
        "Philippine eagle",
        "Spix's macaw",
        "California condor",
        "Ivory-billed woodpecker",
        "Madagascar pochard",
        "Pink-headed duck",
        "Glandore petrel"
    ];

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const masterGain = audioCtx.createGain();
        
        masterGain.gain.value = 3.0;

        osc.connect(gainNode);
        gainNode.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
            gainNode.gain.setValueAtTime(1.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.25);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'taunt') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.setValueAtTime(160, now + 0.15);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'rara-found') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3);
            gainNode.gain.setValueAtTime(1.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        }
    }

    let ambientInterval = null;

    function startHypnoticRhythm() {
        if (ambientInterval) return;

        // Steady sub-bass heartbeat pulse (120 BPM)
        ambientInterval = setInterval(() => {
            if (audioCtx.state === 'suspended') return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);

            gainNode.gain.setValueAtTime(0.30, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.start(now);
            osc.stop(now + 0.08);
        }, 500); 
    }

    function playRandomAmbientSound() {
        // High trigger rate (80% chance) for frequent ambient sounds
        if (Math.random() > 0.80) return;

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        // Picks randomly between Woodblock, High Chime, or Bird Chirp
        const soundChoice = Math.floor(Math.random() * 3);

        if (soundChoice === 0) {
            // Soft woodblock click
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
            
            gainNode.gain.setValueAtTime(0.12, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            
            osc.start(now);
            osc.stop(now + 0.04);

        } else if (soundChoice === 1) {
            // High retro chime
            osc.type = 'triangle';
            const freqs = [1046.50, 1318.51, 1567.98];
            const randomFreq = freqs[Math.floor(Math.random() * freqs.length)];
            
            osc.frequency.setValueAtTime(randomFreq, now);
            
            gainNode.gain.setValueAtTime(0.06, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            
            osc.start(now);
            osc.stop(now + 0.3);

        } else {
            // Synthetic retro bird chirp
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(2800, now + 0.08);
            
            gainNode.gain.setValueAtTime(0.1, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            
            osc.start(now);
            osc.stop(now + 0.08);
        }
    }

    const taunts = [
        "THAT WAS PATHETIC.",
        "BRUHHHHHHHH.",
        "JESUS CHRIST YOU ARE BAD AT THIS BRO!",
        "TRY AGAIN BIRDBRAIN. :P",
        "EVEN A PIGEON KNOWS THAT ONE.",
        "OOF. NOT EVEN CLOSE.",
        "DID YOU EVEN LOOK AT THE BEAK?",
        "BRUTAL MISTAKE.",
        "YOUR ORNITHOLOGY DEGREE IS REVOKED.",
        "THAT'S A HARD YIKES.",
        "WERE YOU GUESSING BLIND?"
    ];

    const praises = [
        "NICE HIT.",
        "CLEAN IDENTIFICATION.",
        "NOT BAD, BIRD NERD.",
        "SOLID PICK.",
        "THAT'S A MATCH.",
        "SPOT ON."
    ];

    function getRankTitle(streak) {
        if (streak >= 50) return "RANK: AUDOBON GODMODE";
        if (streak >= 20) return "RANK: BIRD NERD";
        if (streak >= 15) return "RANK: ORNITHOLOGY WARLORD";
        if (streak >= 10) return "RANK: ELITE FIELD RESEARCHER";
        if (streak >= 6) return "RANK: HAWK-EYED EXPERT";
        if (streak >= 3) return "RANK: ASPIRING TWITCHER";
        return "RANK: BACKYARD CASUAL";
    }

    let streak = 0;
    let currentCorrectAnswer = "";
    let isCurrentRoundRara = false;
    let globalRaraCount = 0;

    document.getElementById('rara-counter').innerText = `RARA AVIS: 0/10`;

    async function fetchBirds() {
        try {
            const randomPage = Math.floor(Math.random() * 200) + 1;
            const response = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=3&verifiable=true&photos=true&quality_grade=research&page=${randomPage}&per_page=30`);
            const data = await response.json();
            return data.results.filter(obs => obs.taxon && obs.taxon.preferred_common_name && obs.photos && obs.photos.length > 0);
        } catch (error) {
            console.error("API fetch failed:", error);
            return [];
        }
    }

    async function nextRound() {
        const container = document.getElementById('options-container');
        const imageBox = document.getElementById('image-box');
        
        container.innerHTML = `<div style="color:#00ffcc; padding:20px;">LOADING SPECIMEN...</div>`;

        let validObs = [];
        while (validObs.length < 4) {
            const batch = await fetchBirds();
            batch.forEach(obs => {
                if (!validObs.some(o => o.taxon.preferred_common_name === obs.taxon.preferred_common_name)) {
                    validObs.push(obs);
                }
            });
        }

        const correctChoice = validObs[Math.floor(Math.random() * validObs.length)];
        currentCorrectAnswer = correctChoice.taxon.preferred_common_name;
        
        isCurrentRoundRara = ultraRareBirds.some(bird => bird.toLowerCase() === currentCorrectAnswer.toLowerCase()) && (globalRaraCount < 10);

        let wrongChoices = validObs.filter(o => o.taxon.preferred_common_name.toLowerCase() !== currentCorrectAnswer.toLowerCase());
        wrongChoices.sort(() => Math.random() - 0.5);
        
        let choices = [correctChoice, ...wrongChoices.slice(0, 3)];
        choices.sort(() => Math.random() - 0.5);

        const imageUrl = correctChoice.photos[0].url.replace('square', 'medium');
        imageBox.innerHTML = `<img src="${imageUrl}" alt="Bird Observation">`;

        // Triggers ambient woodblock/chime/chirp effect on new round
        playRandomAmbientSound();

        container.innerHTML = '';

        choices.forEach(choice => {
            const commonName = choice.taxon.preferred_common_name;
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = commonName;
            
            btn.onclick = () => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                // Starts the steady hypnotic pulse on your very first click
                startHypnoticRhythm();

                playSound('click');
                const tauntBox = document.getElementById('taunt-box');
                
                if (commonName.toLowerCase() === currentCorrectAnswer.toLowerCase()) {
                    streak++;
                    
                    if (isCurrentRoundRara) {
                        playSound('rara-found');
                        globalRaraCount++;
                        document.getElementById('rara-counter').innerText = `RARA AVIS: ${globalRaraCount}/10`;
                        tauntBox.innerText = `⚡ LEGENDARY RARA AVIS IDENTIFIED! (${globalRaraCount}/10)`;
                        tauntBox.style.color = "#00ffcc";
                    } else {
                        playSound('correct');
                        const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                        tauntBox.innerText = randomPraise;
                        tauntBox.style.color = "#00ffcc";
                    }
                } else {
                    streak = 0;
                    playSound('wrong');
                    playSound('taunt');
                    const randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];
                    tauntBox.innerText = randomTaunt;
                    tauntBox.style.color = "#ff0077";
                }
                
                document.getElementById('streak').innerText = `STREAK: ${streak}`;
                document.getElementById('title-display').innerText = getRankTitle(streak);
                nextRound();
            };
            container.appendChild(btn);
        });
    }

    nextRound();
</script>

</body>
</html>
