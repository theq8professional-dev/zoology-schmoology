<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Sea Slug ID - Nudibranch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #020b18;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }
        #game-container {
            text-align: center;
            max-width: 450px;
            width: 90%;
            background: #06152d;
            padding: 20px;
            border: 2px solid #ff007f;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }
        h2 {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        #title-display {
            font-size: 13px;
            color: #ffe600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(255, 230, 0, 0.6);
        }
        #taunt-box {
            color: #ff007f;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 0;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.8);
            letter-spacing: 1px;
            min-height: 18px;
        }
        #taunt-box:not(:empty) {
            margin-bottom: 10px;
        }
        #image-box {
            width: 100%;
            height: 260px;
            background: #000;
            border: 2px solid #00f3ff;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.5);
            position: relative;
        }
        #image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1);
        }

        /* Tactile 3D Arcade Buttons */
        .option-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: #092040;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 0 #008ba3, 0 8px 15px rgba(0, 0, 0, 0.8);
            transition: all 0.05s ease;
        }
        .option-btn:hover {
            background: #103366;
            color: #ffffff;
            border-color: #ffe600;
            box-shadow: 0 6px 0 #00f3ff, 0 0 18px #00f3ff;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #008ba3, 0 0 20px #00f3ff, 0 0 35px #00f3ff;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ffe600;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
        }
    </style>
</head>
<body>

<div id="game-container">
    <h2>[ C-SLUG ]</h2>
    <div id="title-display">RANK: PLANKTON DRIFTER</div>
    <div id="taunt-box"></div>
    <div id="image-box">SCANNING REEF...</div>
    <div id="options-container"></div>
    <div id="hud">
        <div id="rare-counter">RARE SLUGS: 0/10</div>
        <div id="streak">STREAK: 0</div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const ultraRareNudis = [
        "Blue Dragon",
        "Leaf Sheep",
        "Sea Bunny",
        "Pikachu Sea Slug",
        "Spanish Dancer",
        "Neon Sea Slug",
        "Clown Nudibranch",
        "Painted Nudibranch",
        "Opalescent Sea Slug",
        "Lined Chiton"
    ];

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const masterGain = audioCtx.createGain();
        
        masterGain.gain.value = 3.0;

        osc.connect(gainNode);
        gainNode.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(987.77, now + 0.2);
            gainNode.gain.setValueAtTime(1.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(60, now + 0.25);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, now);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'taunt') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(130, now + 0.15);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'rare-found') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.setValueAtTime(739.99, now + 0.1);
            osc.frequency.setValueAtTime(880.00, now + 0.2);
            osc.frequency.setValueAtTime(1174.66, now + 0.3);
            gainNode.gain.setValueAtTime(1.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
            osc.start(now);
            osc.stop(now + 0.65);
        }
    }

    let ambientInterval = null;

    function startHypnoticRhythm() {
        if (ambientInterval) return;

        ambientInterval = setInterval(() => {
            if (audioCtx.state === 'suspended') return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(35, now + 0.12);

            gainNode.gain.setValueAtTime(0.25, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc.start(now);
            osc.stop(now + 0.12);
        }, 600); 
    }

    function playRandomAmbientSound() {
        if (Math.random() > 0.80) return;

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const soundChoice = Math.floor(Math.random() * 3);

        if (soundChoice === 0) {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
            
            gainNode.gain.setValueAtTime(0.1, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            
            osc.start(now);
            osc.stop(now + 0.05);

        } else if (soundChoice === 1) {
            osc.type = 'triangle';
            const freqs = [880, 1046.50, 1318.51];
            const randomFreq = freqs[Math.floor(Math.random() * freqs.length)];
            
            osc.frequency.setValueAtTime(randomFreq, now);
            
            gainNode.gain.setValueAtTime(0.05, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            
            osc.start(now);
            osc.stop(now + 0.25);

        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.exponentialRampToValueAtTime(3200, now + 0.06);
            
            gainNode.gain.setValueAtTime(0.08, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            
            osc.start(now);
            osc.stop(now + 0.06);
        }
    }

    const taunts = [
        "MISSED IT.",
        "TOO SLOW.",
        "NOT A CHANCE.",
        "REALLY?!",
        "WRONG SPECIES DUDE.",
        "NOPE. TRY AGAIN.",
        "FOCUS YOUR EYES!",
        "WORST MARINE BIOLOGIST EVER.",
        "COME ON, MAN!",
        "THE OCEAN IS LAUGHING."
    ];

    const praises = [
        "BIOLUMINESCENT!",
        "MASTER IDENTIFIER!",
        "PURE GENIUS!",
        "EPIC REEF FIND!",
        "SPOT ON!",
        "BRILLIANT!",
        "UNSTOPPABLE!"
    ];

    function getRankTitle(streak) {
        if (streak >= 50) return "RANK: BIOLUMINESCENT DEEP GOD";
        if (streak >= 20) return "RANK: MASTER NUDIBRANCHOLOGIST";
        if (streak >= 15) return "RANK: TIDEPOOL STAN";
        if (streak >= 10) return "RANK: REEF OG";
        if (streak >= 6) return "RANK: SEA SLUG WEIRDO";
        if (streak >= 3) return "RANK: CORAL DRIFTER";
        return "RANK: PLANKTON DRIFTER";
    }

    let streak = 0;
    let currentCorrectAnswer = "";
    let isCurrentRoundRare = false;
    let globalRareCount = 0;

    document.getElementById('rare-counter').innerText = `RARE NUDIS: 0/10`;

    async function fetchNudibranchs() {
        try {
            const randomPage = Math.floor(Math.random() * 150) + 1;
            /* Taxon ID 47113 retrieves Nudibranchia */
            const response = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=47113&verifiable=true&photos=true&quality_grade=research&page=${randomPage}&per_page=30`);
            const data = await response.json();
            return data.results.filter(obs => obs.taxon && obs.taxon.preferred_common_name && obs.photos && obs.photos.length > 0);
        } catch (error) {
            console.error("API fetch failed:", error);
            return [];
        }
    }

    async function nextRound() {
        const container = document.getElementById('options-container');
        const imageBox = document.getElementById('image-box');
        
        container.innerHTML = `<div style="color:#00f3ff; padding:20px;">LOCATING SPECIMEN...</div>`;

        let validObs = [];
        while (validObs.length < 4) {
            const batch = await fetchNudibranchs();
            batch.forEach(obs => {
                if (!validObs.some(o => o.taxon.preferred_common_name === obs.taxon.preferred_common_name)) {
                    validObs.push(obs);
                }
            });
        }

        const correctChoice = validObs[Math.floor(Math.random() * validObs.length)];
        currentCorrectAnswer = correctChoice.taxon.preferred_common_name;
        
        isCurrentRoundRare = ultraRareNudis.some(nudi => nudi.toLowerCase() === currentCorrectAnswer.toLowerCase()) && (globalRareCount < 10);

        let wrongChoices = validObs.filter(o => o.taxon.preferred_common_name.toLowerCase() !== currentCorrectAnswer.toLowerCase());
        wrongChoices.sort(() => Math.random() - 0.5);
        
        let choices = [correctChoice, ...wrongChoices.slice(0, 3)];
        choices.sort(() => Math.random() - 0.5);

        const imageUrl = correctChoice.photos[0].url.replace('square', 'medium');
        imageBox.innerHTML = `<img src="${imageUrl}" alt="Nudibranch Observation">`;

        playRandomAmbientSound();

        container.innerHTML = '';

        choices.forEach(choice => {
            const commonName = choice.taxon.preferred_common_name;
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = commonName;
            
            btn.onclick = () => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                startHypnoticRhythm();

                playSound('click');
                const tauntBox = document.getElementById('taunt-box');
                
                if (commonName.toLowerCase() === currentCorrectAnswer.toLowerCase()) {
                    streak++;
                    
                    if (isCurrentRoundRare) {
                        playSound('rare-found');
                        globalRareCount++;
                        document.getElementById('rare-counter').innerText = `RARE NUDIS: ${globalRareCount}/10`;
                        tauntBox.innerText = `⚡ LEGENDARY RARE SPECIMEN FOUND! (${globalRareCount}/10)`;
                        tauntBox.style.color = "#00f3ff";
                    } else {
                        playSound('correct');
                        const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                        tauntBox.innerText = randomPraise;
                        tauntBox.style.color = "#00f3ff";
                    }
                } else {
                    streak = 0;
                    playSound('wrong');
                    playSound('taunt');
                    const randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];
                    tauntBox.innerText = randomTaunt;
                    tauntBox.style.color = "#ff007f";
                }
                
                document.getElementById('streak').innerText = `STREAK: ${streak}`;
                document.getElementById('title-display').innerText = getRankTitle(streak);
                nextRound();
            };
            container.appendChild(btn);
        });
    }

    nextRound();
</script>

</body>
</html>
