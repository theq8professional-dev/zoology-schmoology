<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly ID</title>
    <style>
        body { margin: 0; padding: 0; background: #020b14; color: #00ff66; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; text-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
        #game-container { text-align: center; max-width: 450px; width: 90%; background: #081726; padding: 20px; border: 2px solid #00ccff; border-radius: 12px; box-shadow: 0 0 25px rgba(0, 204, 255, 0.4), inset 0 0 15px rgba(0, 255, 102, 0.2); }
        h2 { color: #00ccff; text-shadow: 0 0 10px rgba(0, 204, 255, 0.8); margin-top: 0; margin-bottom: 8px; letter-spacing: 2px; }
        #title-display { font-size: 13px; color: #ffe600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 6px rgba(255, 230, 0, 0.6); }
        #taunt-box { color: #00ccff; font-weight: bold; font-size: 14px; margin-bottom: 0; text-shadow: 0 0 8px rgba(0, 204, 255, 0.8); letter-spacing: 1px; min-height: 18px; }
        #taunt-box:not(:empty) { margin-bottom: 10px; }
        #image-box { width: 100%; height: 260px; background: #000; border: 2px solid #00ff66; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-top: 10px; margin-bottom: 20px; box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.5); position: relative; }
        #image-box img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.1); }
        .option-btn { display: block; width: 100%; padding: 14px; margin: 12px 0; background: #002b3d; color: #00ff66; border: 2px solid #00ff66; border-radius: 8px; font-size: 16px; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; position: relative; box-shadow: 0 6px 0 #008844, 0 8px 15px rgba(0, 0, 0, 0.8); transition: all 0.05s ease; }
        .option-btn:hover { background: #004466; color: #ffffff; border-color: #ffe600; box-shadow: 0 6px 0 #00ff66, 0 0 18px #00ff66; }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #008844, 0 0 20px #00ff66, 0 0 35px #00ff66; }
        #hud { display: flex; justify-content: space-between; margin-top: 15px; font-size: 18px; font-weight: bold; color: #ffe600; text-shadow: 0 0 8px rgba(255, 230, 0, 0.6); }
    </style>
</head>
<body>
<div id="game-container">
    <h2>[ BUTTERFLY ID ]</h2>
    <div id="title-display">RANK: BUTTERFLY STUDENT</div>
    <div id="taunt-box"></div>
    <div id="image-box">INITIALIZING FEED...</div>
    <div id="options-container"></div>
    <div id="hud">
        <div id="rare-counter">RARE BUTTERFLYS: 0/10</div>
        <div id="streak">STREAK: 0</div>
    </div>
</div>
<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 3.0;
        osc.connect(gainNode);
        gainNode.connect(masterGain);
        masterGain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'correct') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.15); gainNode.gain.setValueAtTime(1.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(80, now + 0.25); gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'taunt') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now); osc.frequency.setValueAtTime(160, now + 0.15); gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4);
        }
    }

    const taunts = [
        "Failbog",
        ":facepalm: Whoopsie!",
        "Bless your heart",
        "Ewww",
        "Stinker",
        "I am disappointed",
        "Do better",
        "THINK!"
];
    const praises = [
        "You got the hang of this already",
        "Brilliant",
        "Genius!",
        "Amazing",
        "Bingo",
        "What a play!",
        "What a luck!"
];
    function getRankTitle(streak) {
        if (streak >= 100) return "RANK: GODMODE";
        if (streak >= 50) return "RANK: BUTTERFLY WIZARD";
        if (streak >= 20) return "RANK: HUMAN BUTTERFLY ENCYCLOPEDIA";
        if (streak >= 15) return "RANK: BUTTERFLY GENIUS";
        if (streak >= 10) return "RANK: BUTTERFLY WUNDERKIND";
        if (streak >= 5) return "RANK: BUTTERFLY JOURNEYMAN";
        return "RANK: BUTTERFLY STUDENT";
    }

    let streak = 0;
    let currentCorrectAnswer = "";

    async function fetchAnimals() {
        try {
            const randomPage = Math.floor(Math.random() * 200) + 1;
            const response = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=47224&verifiable=true&photos=true&quality_grade=research&page=${randomPage}&per_page=30`);
            const data = await response.json();
            return data.results.filter(obs => obs.taxon && obs.taxon.preferred_common_name && obs.photos && obs.photos.length > 0);
        } catch (error) { return []; }
    }

    async function nextRound() {
        const container = document.getElementById('options-container');
        const imageBox = document.getElementById('image-box');
        container.innerHTML = `<div style="color:#00ff66; padding:20px;">LOADING SPECIMEN...</div>`;
        let validObs = []; let attempts = 0;
        while (validObs.length < 4 && attempts < 10) {
            attempts++;
            const batch = await fetchAnimals();
            batch.forEach(obs => {
                if (!validObs.some(o => o.taxon.preferred_common_name === obs.taxon.preferred_common_name)) validObs.push(obs);
            });
        }
        if (validObs.length < 4) {
            container.innerHTML = `<div style="color:#ff3333; padding:20px;">RETRYING DATA FETCH...</div>`;
            setTimeout(nextRound, 1500);
            return;
        }
        const correctChoice = validObs[Math.floor(Math.random() * validObs.length)];
        currentCorrectAnswer = correctChoice.taxon.preferred_common_name;

        let wrongChoices = validObs.filter(o => o.taxon.preferred_common_name.toLowerCase() !== currentCorrectAnswer.toLowerCase());
        wrongChoices.sort(() => Math.random() - 0.5);
        let choices = [correctChoice, ...wrongChoices.slice(0, 3)].sort(() => Math.random() - 0.5);

        imageBox.innerHTML = `<img src="${correctChoice.photos[0].url.replace('square', 'medium')}" alt="Observation">`;
        container.innerHTML = '';

        choices.forEach(choice => {
            const commonName = choice.taxon.preferred_common_name;
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = commonName;
            btn.onclick = () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                playSound('click');
                const tauntBox = document.getElementById('taunt-box');
                if (commonName.toLowerCase() === currentCorrectAnswer.toLowerCase()) {
                    streak++;
                    playSound('correct');
                    tauntBox.innerText = praises[Math.floor(Math.random() * praises.length)];
                    tauntBox.style.color = "#00ff66";
                } else {
                    streak = 0; 
                    playSound('wrong'); 
                    playSound('taunt');
                    tauntBox.innerText = taunts[Math.floor(Math.random() * taunts.length)];
                    tauntBox.style.color = "#00ccff";
                }
                document.getElementById('streak').innerText = `STREAK: ${streak}`;
                document.getElementById('title-display').innerText = getRankTitle(streak);
                nextRound();
            };
            container.appendChild(btn);
        });
    }
    nextRound();
</script>
</body>
</html>
